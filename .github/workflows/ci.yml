name: AccountsListTCA Compilation Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  compile-check:
    name: Compilation check
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          persist-credentials: false

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Ruby and Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.2'
          bundler-cache: true

      - name: Cache Homebrew
        uses: actions/cache@v3
        with:
          path: /usr/local/Homebrew
          key: brew-${{ runner.os }}-swiftgen
          restore-keys: brew-${{ runner.os }}-

      - name: Install SwiftLint
        run: |
          brew update
          brew install swiftlint
          which swiftlint && swiftlint version

      - name: Restore xcconfig
        run: |
            echo "$XC_CONFIG_BASE64" | base64 --decode > AccountsListTCA/Application/Configuration/ReleaseConfiguration.xcconfig
            ls -la AccountsListTCA/Application/Configuration
        env:
           XC_CONFIG_BASE64: ${{ secrets.XC_CONFIG_BASE64 }}

      - name: Xcode version
        run: /usr/bin/xcodebuild -version

      - name: Build
        run: bundle exec fastlane build
        env:
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8

      - name: Test
        run: bundle exec fastlane test
        env:
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            fastlane/test_output
            fastlane/logs
            **/*.xcresult
